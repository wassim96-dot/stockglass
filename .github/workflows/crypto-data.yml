name: Crypto data (on-chain, funding, fear & greed)

# Every day: Coin Metrics Community on-chain history (MVRV, active addresses), OKX funding, Crypto Fear & Greed
# → data/crypto-history.json and data/crypto.json. Used by the StockGlass page and the stock-verdict skill (crypto mode).
on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: crypto-data
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Fetch crypto data
        timeout-minutes: 12
        run: node scripts/crypto-data.mjs
      - name: Phase-change alert (GitHub issue → phone notification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/phase-alert.mjs crypto
          bash scripts/send-alerts.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-history.json data/crypto.json 2>/dev/null || git add data/crypto-history.json
          git add data/alert-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Crypto data $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 10
          done
          git fetch -q origin "$GITHUB_REF_NAME" && [ -z "$(git log --oneline "origin/$GITHUB_REF_NAME..HEAD")" ] || { echo "::error::the data commit could not be pushed after 3 tries"; exit 1; }
      - name: Phone alert if the job failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/job-failed.sh "Crypto data"
