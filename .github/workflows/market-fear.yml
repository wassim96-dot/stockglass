name: Market fear (VIX)

# Every weekday after the US close: VIX, VIX3M, S&P 500, HYG/IEF → fear score v3 (HAR premium + fear phase) in data/market.json.
# Used by the StockGlass page (entry timing) and by the stock-verdict skill. Also run inside "Weekly watchlist".
on:
  # GitHub often starts scheduled runs hours late (6 to 10 hours in Nov 2026) or skips them, so two backup times re-run it;
  # a run that finds the same close commits nothing. The daily Minervini check starts when this job finishes.
  schedule:
    - cron: "35 22 * * 1-5"
    - cron: "10 2 * * 2-6"
    - cron: "40 5 * * 2-6"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test phase alert (GitHub issue) with today's reading"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: market-fear
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Compute VIX and variance risk premium
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional (free key): FRED's API instead of the often-refused graph page
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # manual run: keep today's live session (marked intraday)
        run: node scripts/market-fear.mjs
      - name: Market regime (rates and inflation, context only)
        continue-on-error: true
        timeout-minutes: 12
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/market-regime.mjs
      - name: Phase-change alert (GitHub issue → phone notification)
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          node scripts/phase-alert.mjs fear
          bash scripts/send-alerts.sh
      - name: Commit
        run: |
          git config user.name "stockglass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market-history.json
          git add data/regime.json 2>/dev/null || true
          git add data/alert-state.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Market fear $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 10
          done
          git fetch -q origin "$GITHUB_REF_NAME" && [ -z "$(git log --oneline "origin/$GITHUB_REF_NAME..HEAD")" ] || { echo "::error::the data commit could not be pushed after 3 tries"; exit 1; }
      - name: Phone alert if the job failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/job-failed.sh "Market fear"
