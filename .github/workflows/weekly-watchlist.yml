name: Weekly watchlist

# Every Friday from 18:00 Paris time. GitHub cron runs in UTC and often starts scheduled runs hours late or
# skips them, so there are several triggers: 16:00 and 17:00 UTC (18:00 Paris in summer / winter), then backups
# on Friday evening and Saturday morning. The guard keeps the first one that starts on Friday from 18:00 Paris
# (or on Saturday) and skips the others once this week's run file exists. A run that starts on Saturday is still
# dated Friday (the prices are Friday's close).
# Run it any time from the Actions tab (also in the GitHub mobile app): "Run workflow".
on:
  schedule:
    - cron: "0 16 * * 5"
    - cron: "0 17 * * 5"
    - cron: "25 19 * * 5"
    - cron: "50 22 * * 5"
    - cron: "35 4 * * 6"
  workflow_dispatch:
    inputs:
      watchlist:
        description: "Optional: comma-separated tickers (blank = watchlist.txt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-watchlist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Keep the first trigger from Friday 18:00 Paris, once per week
        id: guard
        run: |
          go=true; day=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(TZ=Europe/Paris date +%u); H=$((10#$(TZ=Europe/Paris date +%H)))
            if [ "$DOW" = 5 ] && [ "$H" -ge 18 ]; then day=$(TZ=Europe/Paris date +%F)
            elif [ "$DOW" = 6 ]; then day=$(TZ=Europe/Paris date -d yesterday +%F)
            else go=false; echo "Paris time $(TZ=Europe/Paris date '+%a %H:%M'): before Friday 18:00, skipping"; fi
            if [ "$go" = true ] && [ -f "data/runs/$day.json" ]; then go=false; echo "data/runs/$day.json already exists, skipping"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "day=$day" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: "20"

      - name: Install headless Chromium
        if: steps.guard.outputs.go == 'true'
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Market fear (VIX, variance risk premium)
        if: steps.guard.outputs.go == 'true'
        run: node scripts/market-fear.mjs || echo "market fear unavailable, continuing"

      - name: Crypto cycle (on-chain, funding, fear & greed)
        if: steps.guard.outputs.go == 'true'
        run: node scripts/crypto-data.mjs || echo "crypto data unavailable, continuing"

      - name: Run every watchlist ticker through StockGlass
        if: steps.guard.outputs.go == 'true'
        env:
          WATCHLIST: ${{ github.event.inputs.watchlist }}
          RUN_DAY: ${{ steps.guard.outputs.day }}
        run: node scripts/run-watchlist.mjs

      - name: Commit results
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "stockglass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          D="${{ steps.guard.outputs.day }}"; [ -n "$D" ] || D=$(TZ=Europe/Paris date +%F)
          git commit -m "Weekly watchlist run $D"
          git pull --rebase origin main
          git push
